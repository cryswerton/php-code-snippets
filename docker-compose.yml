# PHP snippets app — nginx (port 8080) + PHP-FPM.
#
# Start: docker compose up -d
# Open:  http://localhost:8080/
#
# The JSON store is private/snippets.json. The php-fpm container must be able
# to write that file. If saves fail, run on the host:
#   chmod 775 private && chmod 664 private/snippets.json
# or chown to the uid used inside php:8.3-fpm (often www-data = 33).

services:
  php:
    image: php:8.3-fpm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
